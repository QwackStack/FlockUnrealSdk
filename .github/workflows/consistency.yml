name: Consistency

# Runs the engine-claim and playtest-plugin checks on every pull request and on main.
#
# Those checks live in engine-claim.yml and playtest-plugin.yml, called from here and from release.yml, so a
# tagged release is gated on exactly the rules a pull request was gated on — not on a second copy of them.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-claim:
    uses: ./.github/workflows/engine-claim.yml

  playtest-plugin:
    uses: ./.github/workflows/playtest-plugin.yml

  error-codes:
    # EFlockErrorCode mirrors the backend's detail.code set, and the two have no mechanical link: the
    # codes ship with backend features, the enum is edited here by hand. A code with no member is not an
    # error — it parses to Unknown and reads exactly like a failure the server chose not to code — so the
    # drift is silent by construction. On 2026-08-31 it had reached 26 codes, eight on surface this SDK
    # calls, including the Consume and reward codes that arrived with 1.7.0's own shop work.
    #
    # This is the half that runs without an engine or a backend: it diffs the enum against
    # Tooling/WireErrorCodes.txt, the checked-in snapshot of the wire contract. It cannot catch a code the
    # backend added since that file was refreshed — refreshing it is a manual step documented in its
    # header, the same shape as Build-AllEngines.ps1 being a manual pre-tag run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every wire error code has an EFlockErrorCode member
        run: |
          set -euo pipefail

          CODES=Tooling/WireErrorCodes.txt
          HEADER=Source/Flock/Public/Http/FlockErrorCode.h

          for f in "$CODES" "$HEADER"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. The error-code check reads both files; if one moved, update this workflow with it."
              exit 1
            fi
          done

          # The enum's members, one per line. Matches a bare "Member," line, which is how every member is
          # written; Unknown carries "= 0" and is deliberately not matched, since no wire code maps to it.
          grep -oE '^[[:space:]]+[A-Z][A-Za-z]+,[[:space:]]*$' "$HEADER" | tr -d ' \t,\r' | sort -u > /tmp/members.txt

          # Section-aware read of the snapshot: [documented] and [undocumented] must have members,
          # [waived] must not.
          awk '
            /^\[.*\]$/ { section = $0; next }
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            { gsub(/\r/, ""); print section "\t" $1 }
          ' "$CODES" > /tmp/coded.txt

          # code -> member name: split on . and _, capitalise each part, concatenate. This mirrors
          # FFlockErrorCodes::Parse exactly; if that ever stops being a mechanical transform, this breaks
          # loudly rather than quietly passing, which is the right failure. Done in one pass rather than
          # per code, so the check stays a couple of processes instead of a couple of thousand.
          awk -F'\t' '{
            n = split($2, parts, /[._]/); member = ""
            for (i = 1; i <= n; i++) member = member toupper(substr(parts[i], 1, 1)) substr(parts[i], 2)
            print $1 "\t" $2 "\t" member
          }' /tmp/coded.txt > /tmp/expected.txt

          missing=0
          waived_but_present=0

          while IFS=$'\t' read -r section code member; do
            [ -n "$code" ] || continue
            if grep -qx "$member" /tmp/members.txt; then
              if [ "$section" = "[waived]" ]; then
                echo "::error file=$CODES::'$code' is under [waived] but EFlockErrorCode::$member exists. If the feature landed, move the code to [documented] and give it a hint in FlockErrorHints.cpp."
                waived_but_present=$((waived_but_present + 1))
              fi
            else
              if [ "$section" != "[waived]" ]; then
                echo "::error file=$HEADER::'$code' has no EFlockErrorCode member. Add '$member' to its namespace group in FlockErrorCode.h and a hint for it in FlockErrorHints.cpp, or move the code to [waived] in $CODES if this SDK does not call that feature."
                missing=$((missing + 1))
              fi
            fi
          done < /tmp/expected.txt

          # The other direction is a warning, not a failure. A member no listed code maps to is usually a
          # backend rename the SDK did not follow — the member then can never fire, and neither can its
          # hint. It is not an error because the snapshot is refreshed by hand and can legitimately lag.
          cut -f3 /tmp/expected.txt | sort -u > /tmp/expected_members.txt
          comm -23 /tmp/members.txt /tmp/expected_members.txt | while read -r member; do
            [ -n "$member" ] || continue
            echo "::warning file=$HEADER::EFlockErrorCode::$member maps to no code in $CODES. Either the snapshot is stale, or the backend renamed the code and this member (and its hint) can never fire."
          done

          total=$(grep -cvE '^[[:space:]]*(#|\[|$)' "$CODES")
          if [ "$missing" -gt 0 ] || [ "$waived_but_present" -gt 0 ]; then
            echo "::error::Error-code drift: $missing code(s) without a member, $waived_but_present waived code(s) that have one."
            exit 1
          fi
          echo "$total wire error codes checked against $(wc -l < /tmp/members.txt) enum members — no drift."

      - name: Every failure the SDK finds itself says how to fix it
        run: |
          set -euo pipefail

          # Every failure a developer sees says what is wrong and how to fix it. FFlockError::Make stamps the fix
          # from the error's code, or from its kind when the code has none: that fits a cancel, a timeout, no
          # connection and an unreadable answer (or a body the SDK could not write) wherever they happen, and an answer
          # from Flock's game API, which the HTTP client classifies by its status. Any other failure, the SDK's own or
          # an answer from elsewhere (asset storage), has a cause only its call site knows, so it is built with
          # FFlockError::MakeWithFix and states its own fix. A Make whose type is a variable is caught too.
          hits=$(git ls-files -z -- 'Source/*.cpp' 'Source/*.h' 'OptionalPlugins/*.cpp' 'OptionalPlugins/*.h' \
            | grep -zv -e '/Tests/' -e '^Source/Flock/Private/Http/FlockHttpClient\.cpp$' \
                -e '^Source/Flock/Public/Http/FlockHttpClient\.h$' -e '^Source/Flock/Private/Http/FlockError\.cpp$' \
            | xargs -0 perl -0777 -ne 'while (/FFlockError::Make\((?!\s*EFlockErrorType::(?:Cancelled|Timeout|Connection|Serialization)\b)/g) { my $line = 1 + (substr($_, 0, pos($_)) =~ tr/\n//); print "$ARGV:$line: FFlockError::Make\n"; }' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A failure is built with FFlockError::Make outside the HTTP client, so it carries only a generic fix. Build it with FFlockError::MakeWithFix and say how to fix it."
            exit 1
          fi
          echo "Every failure the SDK finds itself states its fix."

  standalone:
    # Shipped code and docs present this SDK on its own: a comment that leans on another engine's SDK ("the
    # canonical SDK does it this way") tells a studio reading it nothing, and fifteen of them had crept in.
    # Reads text files only, so it needs no engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No shipped file names another engine's SDK
        run: |
          set -euo pipefail

          # What a release carries. "unity build" and its relatives are the compiler's term, not the engine's.
          hits=$(git ls-files -z -- Source OptionalPlugins Documentation README.md CHANGELOG.md Flock.uplugin \
            | xargs -0 grep -n -I -i -E 'canonical sdk|canonical (buffers|uses|splits|does|reads|carries)|\bunity\b|\bgodot\b' \
            | grep -v -i -E 'unity build|unity-safe|bUseUnity|adaptive unity|unity blob' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A shipped file names another engine's SDK; say what this SDK does instead."
            exit 1
          fi
          echo "No shipped file names another engine's SDK."

  blueprint-nodes:
    # Three rules about Blueprint nodes that no compiler checks. Reads text files only, so it needs no engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A node the game instance keeps holds its world context weakly
        run: |
          set -euo pipefail

          # A node registered with the game instance (RegisterWithGameInstance) lives until its pin fires: seconds for a sign-in,
          # minutes for a search or a travel. Held in a UPROPERTY, its world context (often an actor or a widget of the level that
          # called it) keeps that level's world alive past a level change, which the engine reports as a world not cleaned up by
          # garbage collection, and can be told to treat as fatal. The multiplayer and sign-in nodes held it so until 1.32.0.
          BAD=""
          CHECKED=0
          for SOURCE in $(grep -rl --include='*.cpp' 'RegisterWithGameInstance' Source/Flock/Private/Blueprint || true); do
            HEADER="Source/Flock/Public/Blueprint/$(basename "${SOURCE%.cpp}").h"
            if [ ! -f "$HEADER" ]; then
              echo "::error file=$SOURCE::$SOURCE registers nodes with the game instance, but $HEADER, where this check expects their declarations, is missing. Update this workflow with where they moved."
              exit 1
            fi
            CHECKED=$((CHECKED + 1))
            if grep -q 'TObjectPtr<UObject> WorldContextObject' "$HEADER"; then
              BAD="$BAD $HEADER"
            fi
          done

          if [ -n "$BAD" ]; then
            echo "::error::These nodes are kept by the game instance and hold their world context in a UPROPERTY:$BAD. Hold it as TWeakObjectPtr<UObject>, and read it with .Get() where the node runs."
            exit 1
          fi
          echo "The $CHECKED node files whose nodes the game instance keeps hold their world context weakly."

      - name: Every Blueprint node finds the game's Flock through its world context
        run: |
          set -euo pipefail

          # A node's factory names its world context input (WorldContext in its meta), so a graph in an Actor, a widget or the
          # game instance fills it with Self and the node finds that game's Flock. Without it the input is a plain pin that
          # defaults to nothing, the graph still compiles, and the node answers that Flock is not running in a game where it is.
          python3 - <<'PY'
          import glob
          import re
          import sys

          factories = 0
          marked = 0
          missing = []
          for path in sorted(glob.glob("Source/**/*.h", recursive=True) + glob.glob("OptionalPlugins/**/*.h", recursive=True)):
              with open(path, encoding="utf-8", errors="replace") as f:
                  text = f.read()
              marked += text.count("BlueprintInternalUseOnly")
              for match in re.finditer(r"UFUNCTION\(([^;{}]*?)\)\s*static\b[^;(]*?\b(\w+)\s*\(", text):
                  meta, name = match.group(1), match.group(2)
                  if "BlueprintInternalUseOnly" not in meta:
                      continue
                  factories += 1
                  if "WorldContext" not in meta:
                      missing.append(f"{path}: {name}")

          if factories == 0 or factories != marked:
              # A declaration this scan cannot read (a comment between UFUNCTION and static, say) would otherwise go unchecked.
              print(f"::error::Read {factories} Blueprint node factories but BlueprintInternalUseOnly appears {marked} times. Declare each node factory as UFUNCTION(...) followed directly by static, or update this workflow to read the new form.")
              sys.exit(1)
          if missing:
              for line in missing:
                  print(f"::error::{line} has no WorldContext in its meta, so a graph cannot fill it with Self. Add WorldContext = \"WorldContextObject\" to its UFUNCTION meta.")
              sys.exit(1)
          print(f"Every one of the {factories} Blueprint node factories names its world context.")
          PY

      - name: Every multiplayer spelling a game compares against has a Blueprint node
        run: |
          set -euo pipefail

          MODELS=Source/Flock/Public/Models/FlockMultiplayerModels.h
          LIBRARY=Source/Flock/Public/Blueprint/FlockMultiplayerLibrary.h
          for f in "$MODELS" "$LIBRARY"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. This check reads it; if it moved, update this workflow with it."
              exit 1
            fi
          done

          # The game-facing sets. The wire's own spellings (the ...WireValues namespaces) are the SDK's to read, not a game's.
          NAMESPACES="FlockMultiplayerSessionEndReasons FlockMultiplayerConnectionModes FlockDirectConnectionValues FlockTravelToSessionOutcomes FlockTravelToSessionRefusedReasons FlockMatchmakingOutcomes"
          MISSING=""
          TOTAL=0
          for NS in $NAMESPACES; do
            NAMES=$(awk -v ns="$NS" '{ sub(/\r$/, "") } $1 == "namespace" && $2 == ns { inside = 1; next } inside && /^}/ { inside = 0 } inside { print }' "$MODELS" \
              | grep -oE 'inline constexpr const TCHAR\* [A-Za-z]+' | awk '{ print $NF }' || true)
            if [ -z "$NAMES" ]; then
              echo "::error file=$MODELS::Found no constants in $NS. If it was renamed or moved, update this workflow with it."
              exit 1
            fi
            for NAME in $NAMES; do
              TOTAL=$((TOTAL + 1))
              if ! grep -qF "$NS::$NAME;" "$LIBRARY"; then
                MISSING="$MISSING $NS::$NAME"
              fi
            done
          done

          if [ -n "$MISSING" ]; then
            echo "::error file=$LIBRARY::No Blueprint node returns:$MISSING. Add a pure node for each to UFlockMultiplayerLibrary, and its line to the test Flock.Multiplayer.Nodes.TheConstantNodes_SpellEachValueAsTheSdkDoes, so a Blueprint can compare against it without typing it."
            exit 1
          fi
          echo "Every one of the $TOTAL multiplayer spellings a game compares against has a Blueprint node."

  version:
    # Three facts about a release have to agree and nothing mechanical links them: Flock.uplugin's
    # VersionName is what the archive is named for and what UFlockSubsystem::SdkVersion is bumped
    # alongside, CHANGELOG.md is where a user finds out what actually changed, and main's VersionName is
    # what the last release shipped as.
    #
    # release.yml already refuses a tag that disagrees with VersionName, and that check is not repeated
    # here — it has exactly one correct place to live. But it fires on a tag push, which is the last
    # possible moment: by then the branch is merged, and the fix is a fresh commit on main plus a moved
    # tag. The dangling v1.5.0 tag is what that costs. VersionName still read 1.4.0 at the
    # notification-work merge, so the tag named a version the manifest had never been bumped to; nothing
    # published, and 1.5.0 is now a number this project has to skip. A bump check on the pull request
    # would have caught it while it was still one amend.
    #
    # Needs no engine, same as the checks above — these read text files.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # At v4 this is documented as "all history for all branches and tags". The bump check reads the
          # manifest out of the pull request's base commit, and the default depth of 1 does not contain
          # it. Resolving the base by sha rather than re-deriving a merge base is what makes the
          # comparison exact: main can move between the event being created and this job running.
          fetch-depth: 0

      # Each step re-reads the manifest instead of passing a step output along. They are meant to be
      # liftable — copied out and run against a doctored file to prove they fail — and a step that only
      # works downstream of another cannot be run that way.
      - name: Flock.uplugin VersionName is valid semver
        run: |
          set -euo pipefail

          MANIFEST=Flock.uplugin

          # The same extraction release.yml uses, so the two cannot disagree about what the version *is*
          # while arguing about whether it is valid.
          VERSION=$(grep -o '"VersionName": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4 || true)

          if [ -z "$VERSION" ]; then
            echo "::error file=$MANIFEST::No VersionName found in $MANIFEST. Add a \"VersionName\": \"X.Y.Z\" entry — the release archive and the tag check both read it."
            exit 1
          fi

          # Strict MAJOR.MINOR.PATCH: no prerelease suffix, no leading zeros. Narrower than semver
          # proper, deliberately. Every version this plugin has shipped is X.Y.Z, the tag check is a
          # string comparison, and `sort -V` orders a prerelease suffix in a way that would make the bump
          # check below quietly wrong. Widen this and that comparison has to be rewritten with it.
          if ! printf '%s' "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error file=$MANIFEST::VersionName \"$VERSION\" is not valid semver. Write it as MAJOR.MINOR.PATCH with no prerelease suffix and no leading zeros, e.g. 1.8.0 — and bump UFlockSubsystem::SdkVersion and CHANGELOG.md with it."
            exit 1
          fi

          echo "Flock.uplugin VersionName is $VERSION."

      - name: CHANGELOG.md has an entry for that version
        run: |
          set -euo pipefail

          MANIFEST=Flock.uplugin
          LOG=CHANGELOG.md

          VERSION=$(grep -o '"VersionName": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4 || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=$MANIFEST::No VersionName found in $MANIFEST, so there is nothing to look for in $LOG."
            exit 1
          fi

          if [ ! -f "$LOG" ]; then
            echo "::error::$LOG is missing. This check reads it; if it moved, update this workflow with it."
            exit 1
          fi

          # The dots are literal. Unescaped, "1.8.0" also matches "1a8b0" — the kind of match that makes
          # a check pass for the wrong reason.
          ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')

          # The Keep a Changelog heading, as every entry in this file is written: "## [1.8.0] - 2026-08-31".
          if ! grep -qE "^##[[:space:]]+\[${ESCAPED}\]" "$LOG"; then
            echo "::error file=$LOG::No entry for $VERSION. Add a '## [$VERSION] - YYYY-MM-DD' heading describing what changed — the release notes and the plugin download both claim this version, and this file is the only place that says what is in it."
            exit 1
          fi

          echo "$LOG documents $VERSION."

      - name: The README's banner names the manifest's version
        run: |
          set -euo pipefail

          MANIFEST=Flock.uplugin
          README=README.md

          VERSION=$(grep -o '"VersionName": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4 || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=$MANIFEST::No VersionName found in $MANIFEST, so there is nothing to look for in $README."
            exit 1
          fi

          # The banner a developer reads first: "> **1.34.0.** Everything documented below ships today." It was bumped by
          # hand alone, and 1.34.0's first tree still said 1.33.0.
          ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if ! grep -qE "^> \*\*${ESCAPED}\.\*\* " "$README"; then
            FOUND=$(grep -oE '^> \*\*[0-9]+\.[0-9]+\.[0-9]+\.\*\*' "$README" | head -1 || true)
            echo "::error file=$README::The README's banner reads '${FOUND:-nothing}', not $VERSION. Set its first line under the title to '> **$VERSION.** Everything documented below ships today.'"
            exit 1
          fi

          echo "$README's banner names $VERSION."

      - name: UFlockSubsystem::SdkVersion matches the manifest
        run: |
          set -euo pipefail

          # The third leg of the version trio, and the one with no other check behind it. A bump touches
          # Flock.uplugin, this constant and CHANGELOG.md together; the steps above cover the first two,
          # and release.yml covers the tag. Nothing covered this one.
          #
          # A stale value here fails silently and keeps failing after the release: it is what the SDK
          # reports at *runtime*, so it stamps the analytics device record, the crash tombstone, and the
          # `sdk` field of every snapshot envelope written to disk. Telemetry then attributes a fleet of
          # sessions to a version that never shipped, and nothing anywhere goes red — the number is just
          # wrong, in the backend, for as long as those builds are live.
          MANIFEST=Flock.uplugin
          SUBSYSTEM=Source/Flock/Private/FlockSubsystem.cpp

          VERSION=$(grep -o '"VersionName": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4 || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=$MANIFEST::No VersionName found in $MANIFEST, so there is nothing to compare the runtime constant against."
            exit 1
          fi

          if [ ! -f "$SUBSYSTEM" ]; then
            echo "::error::$SUBSYSTEM is missing. This check reads UFlockSubsystem::SdkVersion out of it; if the definition moved, update this workflow with it."
            exit 1
          fi

          # Matches the definition, not a mention: the assignment and its TEXT() literal have to be on the
          # line. `head -1` because a match is the definition and there is exactly one — a second would
          # mean the constant is defined twice, which the compiler would reject first.
          SDK_VERSION=$(grep -oE 'UFlockSubsystem::SdkVersion[[:space:]]*=[[:space:]]*TEXT\("[^"]*"\)' "$SUBSYSTEM" \
                          | head -1 | grep -oE '"[^"]*"' | tr -d '"' || true)

          if [ -z "$SDK_VERSION" ]; then
            echo "::error file=$SUBSYSTEM::Could not read UFlockSubsystem::SdkVersion. This check expects the definition to stay on one line, as: const FString UFlockSubsystem::SdkVersion = TEXT(\"X.Y.Z\"); — if it was reformatted or moved, update this workflow with it rather than relaxing the pattern."
            exit 1
          fi

          if [ "$SDK_VERSION" != "$VERSION" ]; then
            echo "::error file=$SUBSYSTEM::UFlockSubsystem::SdkVersion is $SDK_VERSION but $MANIFEST says $VERSION. Bump the constant to $VERSION — it is what the SDK reports at runtime, so a stale value misattributes analytics, crash markers and snapshot envelopes to a version that never shipped."
            exit 1
          fi

          echo "UFlockSubsystem::SdkVersion and $MANIFEST both read $VERSION."

      - name: VersionName is ahead of main
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          MANIFEST=Flock.uplugin

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "Not a pull request — there is no base version to compare against."
            exit 0
          fi

          if [ "$BASE_REF" != "main" ]; then
            echo "This pull request targets '$BASE_REF', not main — the bump is enforced on the way into main."
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Could not resolve the base commit '${BASE_SHA:-<empty>}'. This step needs the checkout above to keep fetch-depth: 0."
            exit 1
          fi

          # Skipped, not failed, when no code moved: nothing under Flock's Source/ or an optional plugin's.
          # A docs, workflow or CHANGELOG-only pull request ships no code, and demanding a bump for one either
          # trains people to bump for nothing or trains them to merge past a red check. Both are worse than
          # not asking. An optional plugin's code counts because it ships at Flock's version: a playtest fix
          # released under a number main already shipped would be a second, different download of that version.
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          if ! printf '%s\n' "$CHANGED" | grep -qE '^(Source|OptionalPlugins/[^/]+/Source)/'; then
            echo "No code under Source/ or OptionalPlugins/*/Source/ changed — no version bump required. Changed:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
            exit 0
          fi

          VERSION=$(grep -o '"VersionName": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4 || true)
          BASE_VERSION=$(git show "${BASE_SHA}:${MANIFEST}" | grep -o '"VersionName": *"[^"]*"' | cut -d'"' -f4 || true)

          if [ -z "$VERSION" ] || [ -z "$BASE_VERSION" ]; then
            echo "::error file=$MANIFEST::Could not read VersionName from this branch ('${VERSION:-<empty>}') or from main ('${BASE_VERSION:-<empty>}')."
            exit 1
          fi

          echo "this branch: $VERSION   main: $BASE_VERSION"

          if [ "$VERSION" = "$BASE_VERSION" ]; then
            echo "::error file=$MANIFEST::This pull request changes code (under Source/ or OptionalPlugins/*/Source/) but leaves VersionName at $BASE_VERSION, the version main already shipped. Bump it, bump UFlockSubsystem::SdkVersion and CHANGELOG.md with it, and give OptionalPlugins/ProtokitePlaytest/ProtokitePlaytest.uplugin the same VersionName and Version."
            exit 1
          fi

          # sort -V puts the higher version last. Equality is handled above, so anything not strictly
          # greater is a version that went backwards.
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$BASE_VERSION" | sort -V | tail -1)
          if [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error file=$MANIFEST::VersionName $VERSION is lower than main's $BASE_VERSION. A release can only move forward — the tag, the archive name and the CHANGELOG all read this field."
            exit 1
          fi

          echo "VersionName $VERSION is ahead of main's $BASE_VERSION."

          # Version, the integer the engine compares to tell an update from an older build, moves forward with it.
          # The playtest plugin's must equal Flock's (playtest-plugin.yml), so checking Flock's covers both.
          NUMBER=$(grep -oE '"Version": *[0-9]+' "$MANIFEST" | grep -oE '[0-9]+$' || true)
          BASE_NUMBER=$(git show "${BASE_SHA}:${MANIFEST}" | grep -oE '"Version": *[0-9]+' | grep -oE '[0-9]+$' || true)
          if [ -z "$NUMBER" ] || [ -z "$BASE_NUMBER" ] || [ "$NUMBER" -le "$BASE_NUMBER" ]; then
            echo "::error file=$MANIFEST::Version is ${NUMBER:-<unreadable>} on this branch and ${BASE_NUMBER:-<unreadable>} on main. Raise it with VersionName, in both manifests."
            exit 1
          fi
          echo "Version $NUMBER is ahead of main's $BASE_NUMBER."
