name: Release

# Publishes the plugin zip when a version tag is pushed:
#
#     git tag v0.14.0 && git push origin v0.14.0
#
# The archive is built with `git archive`, so it contains exactly the tracked files and nothing else —
# no Binaries/, Intermediate/ or Saved/ can leak in, because they are never committed. The `--prefix`
# is what makes the zip drop straight into a project: it nests everything under FlockUnrealSdk/, so
# extracting into `YourProject/Plugins/` lands the plugin where Unreal expects it.
#
# The optional playtest plugin ships from the same tag as a second zip, nested under ProtokitePlaytest/ so it
# extracts beside Flock rather than inside it. Unreal stops looking for plugins below the first .uplugin it
# finds, which is why it cannot ride along inside Flock's archive.
#
# The engine-claim checks gate the publish. They already run on pull requests and on main, but a tag can
# be pushed at any commit — including one that never went through either — and the checks do not fire on
# tag pushes of their own accord (`push: branches:` does not match a tag). Without this gate the one
# release that actually states an engine range could ship without the rules behind that range ever having
# been run. Calling the same reusable workflow means it is the same rules, not a copy of them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  engine-claim:
    uses: ./.github/workflows/engine-claim.yml

  # Keeps the playtest plugin optional and holds its version equal to Flock's. The tag check below reads
  # only Flock.uplugin, and relies on this job for the playtest plugin's manifest.
  playtest-plugin:
    uses: ./.github/workflows/playtest-plugin.yml

  release:
    needs: [engine-claim, playtest-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(grep -o '"VersionName": *"[^"]*"' Flock.uplugin | cut -d'"' -f4)
          echo "tag=$TAG  Flock.uplugin=$PLUGIN"
          # A tag that disagrees with the manifest ships a download whose version is a lie, and the
          # mismatch is invisible until someone reports a bug against the wrong release.
          if [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::Tag v$TAG does not match VersionName $PLUGIN in Flock.uplugin"
            exit 1
          fi

      - name: Build the plugin archives
        run: |
          set -euo pipefail

          git archive --format=zip --prefix=FlockUnrealSdk/ -o "FlockUnrealSdk-${GITHUB_REF_NAME}.zip" HEAD

          # The playtest plugin is archived from its own folder, so its zip holds ProtokitePlaytest/ and nothing
          # else. That leaves the repository's LICENSE.md behind, and every source file's header points at
          # it, so it is added back at the plugin's root.
          git archive --format=zip --prefix=ProtokitePlaytest/ --add-file=LICENSE.md \
            -o "ProtokitePlaytest-${GITHUB_REF_NAME}.zip" HEAD:OptionalPlugins/ProtokitePlaytest

      # Checked rather than assumed, in both directions. Flock's zip is built from the whole repository, so
      # without the export-ignore in .gitattributes it would carry OptionalPlugins/: a second plugin nested
      # where Unreal never looks, in every project that wanted only Flock. The playtest zip is built from a
      # subtree, so a wrong path would archive the wrong tree or leave the licence out.
      - name: Check what each archive contains
        run: |
          set -euo pipefail

          FLOCK_ZIP="FlockUnrealSdk-${GITHUB_REF_NAME}.zip"
          PLAYTEST_ZIP="ProtokitePlaytest-${GITHUB_REF_NAME}.zip"
          unzip -Z1 "$FLOCK_ZIP" > flock-entries.txt
          unzip -Z1 "$PLAYTEST_ZIP" > playtest-entries.txt

          FAILED=0
          require_entry() {
            if ! grep -qxF "$2" "$1"; then
              echo "::error::$1 has no entry $2."
              FAILED=1
            fi
          }

          require_entry flock-entries.txt FlockUnrealSdk/Flock.uplugin
          if grep -E '(^|/)OptionalPlugins/|ProtokitePlaytest' flock-entries.txt; then
            echo "::error::Flock's archive contains the playtest plugin (entries above). Keep OptionalPlugins/ export-ignored in .gitattributes."
            FAILED=1
          fi

          require_entry playtest-entries.txt ProtokitePlaytest/ProtokitePlaytest.uplugin
          require_entry playtest-entries.txt ProtokitePlaytest/LICENSE.md
          require_entry playtest-entries.txt ProtokitePlaytest/Source/ProtokitePlaytest/ProtokitePlaytest.Build.cs
          require_entry playtest-entries.txt ProtokitePlaytest/Source/ProtokitePlaytestEditor/ProtokitePlaytestEditor.Build.cs
          if grep -v '^ProtokitePlaytest/' playtest-entries.txt; then
            echo "::error::The playtest archive has entries outside ProtokitePlaytest/ (above)."
            FAILED=1
          fi
          MANIFESTS=$(grep -c '\.uplugin$' playtest-entries.txt || true)
          if [ "$MANIFESTS" != "1" ]; then
            echo "::error::The playtest archive holds $MANIFESTS .uplugin files; it must hold exactly one."
            FAILED=1
          fi

          if [ "$FAILED" != "0" ]; then
            exit 1
          fi
          echo "$FLOCK_ZIP: $(wc -l < flock-entries.txt) entries, no playtest plugin. $PLAYTEST_ZIP: $(wc -l < playtest-entries.txt) entries, one manifest, licence included."

      # Informational only. The notes are no longer affected by a release already existing — the step
      # below composes the whole body, so a re-run replaces it — but it is still worth knowing that this
      # run updated something rather than created it, because a hand-drafted release for a tag about to
      # be pushed is usually a mistake.
      - name: Note whether a release already exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [ "$CODE" = "200" ]; then
            echo "::warning::A release already exists for ${GITHUB_REF_NAME}; this run will update it and overwrite its notes. Let this workflow create releases — do not pre-draft one for a tag you are about to push."
          else
            echo "No existing release for ${GITHUB_REF_NAME} (HTTP $CODE) — this run will create it."
          fi

      # The body is composed here rather than left to `generate_release_notes`, and that is the fix for
      # the duplicated "What's Changed".
      #
      # That input does not *set* a body. When a release for the tag already exists the action updates it,
      # and the generated notes end up combined with the body already there — so every re-run stacks
      # another copy. v1.1.0 and v1.4.0 both shipped that way, and `append_body: false` did not prevent it
      # because the combining happens on the API side, not in the action's append path.
      #
      # Fetching the notes as text and passing the whole body makes the step idempotent: the same tag
      # always produces the same document, and publishing twice overwrites instead of accumulating. It
      # also leaves somewhere to put the engine range, which is the thing a reader most needs and the one
      # fact a generated changelog can never contain.
      - name: Compose the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          FLOOR: ${{ needs.engine-claim.outputs.floor }}
          CEILING: ${{ needs.engine-claim.outputs.ceiling }}
        run: |
          set -euo pipefail

          # Exactly what GitHub would have generated, fetched so we own the composition rather than the
          # merge behaviour.
          GENERATED=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq '.body')

          if [ -z "$GENERATED" ]; then
            echo "::error::GitHub returned empty release notes for ${GITHUB_REF_NAME}; refusing to publish a release with no changelog."
            exit 1
          fi

          # The range comes from the job that just validated it against the manifest, README and compat
          # header — so the notes cannot state a range those checks disagreed with, and there is no second
          # parser here to drift from the one in engine-claim.yml.
          if [ -z "$FLOOR" ] || [ -z "$CEILING" ]; then
            echo "::error::The engine-claim job published no range; the release notes would understate what this build supports."
            exit 1
          fi

          if [ "$FLOOR" = "$CEILING" ]; then
            SUPPORT="Verified on **Unreal Engine ${FLOOR}**."
          else
            SUPPORT="Verified on **Unreal Engine ${FLOOR} to ${CEILING}** — built, and the full automation suite green, on each."
          fi

          {
            printf '%s\n\n' "$GENERATED"
            # Two zips are attached, and the second one is easy to extract into the wrong place: inside Flock's
            # folder, where Unreal never loads it.
            printf '## Downloads\n\n'
            printf -- '- `FlockUnrealSdk-%s.zip`: the Flock SDK. Extract it into the `Plugins/` folder of your project.\n' "$GITHUB_REF_NAME"
            printf -- '- `ProtokitePlaytest-%s.zip`: the optional Protokite playtesting plugin, in beta. Extract it next to the Flock SDK, so that `Plugins/ProtokitePlaytest/` sits beside `Plugins/FlockUnrealSdk/`, then enable it in your project. It stays off until **Enable Playtesting** is turned on; leave it out of projects that are not running playtests.\n\n' "$GITHUB_REF_NAME"
            printf '## Supported Unreal Engine versions\n\n'
            printf '%s\n\n' "$SUPPORT"
            printf 'Below UE %s the plugin refuses to compile, so landing on an unsupported engine is one clear error rather than a cascade of unknown symbols. Above UE %s it still compiles and emits a notice — untested, and deliberately not blocked, so a newly released engine never breaks a project on day one.\n' "$FLOOR" "$CEILING"
          } > release-notes.md

          echo "Composed notes for ${GITHUB_REF_NAME} (UE ${FLOOR} to ${CEILING}):"
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlockUnrealSdk-*.zip
            ProtokitePlaytest-*.zip
          body_path: release-notes.md
          # Off, deliberately: the body above is complete, and leaving this on is what duplicated the
          # notes. `append_body: false` keeps an existing body from being combined with ours, so a re-run
          # replaces the notes rather than stacking another copy. `name` is pinned so a re-run cannot
          # quietly retitle a published release.
          generate_release_notes: false
          append_body: false
          name: ${{ github.ref_name }}
