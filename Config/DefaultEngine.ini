; Flock SDK plugin config.
; CoreRedirects migrate any values saved under the old module/class path
; ([/Script/Qwack_ue_Sdk.QwackConfig]) to the renamed Flock module/class.
[CoreRedirects]
+PackageRedirects=(OldName="/Script/Qwack_ue_Sdk",NewName="/Script/Flock")
+ClassRedirects=(OldName="/Script/Qwack_ue_Sdk.QwackConfig",NewName="/Script/Flock.FlockConfig")
